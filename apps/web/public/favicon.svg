<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .wave { fill: #e8d5c4; }
        .bg { fill: #0f1410; }
      }
      @media (prefers-color-scheme: light) {
        .wave { fill: #1a1a1a; }
        .bg { fill: #f5f5f5; }
      }
    </style>
  </defs>
  <rect class="bg" width="64" height="64"/>
  <g class="wave" transform="translate(32, 32)">
    <!-- Onda sonora central -->
    <path d="M -2 -8 Q -2 0 0 8 Q 2 0 2 -8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M -8 -12 Q -8 0 0 12 Q 8 0 8 -12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 4 -6 Q 4 0 6 6 Q 8 0 8 -6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>